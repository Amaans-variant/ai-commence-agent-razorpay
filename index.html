<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Commerce Agent</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 50px; }
        #chat-box { width: 400px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex-grow: 1; height: 400px; overflow-y: auto; padding: 20px; border-bottom: 1px solid #ddd; }
        .msg { margin-bottom: 15px; padding: 10px; border-radius: 5px; max-width: 80%; }
        .user-msg { background: #007bff; color: white; align-self: flex-end; margin-left: auto; }
        .ai-msg { background: #e9ecef; color: black; align-self: flex-start; }
        .pay-btn { display: inline-block; margin-top: 10px; padding: 8px 12px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        #input-area { display: flex; padding: 10px; background: #fff; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { margin-left: 10px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-box">
    <div id="messages">
        <div class="msg ai-msg">Hello! I can help you purchase the Pro Study Dashboard or the Lifetime Study Assistant. What are you looking for?</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Generate a random session ID when the page loads
    const currentSessionId = "user_" + Math.random().toString(36).substring(7);

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const messageText = inputField.value.trim();
        if (!messageText) return;

        appendMessage(messageText, "user-msg");
        inputField.value = "";

        try {
            // Send both the message and the session ID
            const response = await fetch("http://localhost:8000/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    message: messageText, 
                    session_id: currentSessionId 
                })
            });
            const data = await response.json();
            
            if (data.reply.includes("https://rzp.io/")) {
                const link = data.reply.match(/https:\/\/rzp\.io\S+/)[0];
                const textWithoutLink = data.reply.replace(link, "").trim();
                
                // Create a unique ID for the button so we can change it later
                const btnId = "btn-" + Math.random().toString(36).substring(7);
                let htmlReply = textWithoutLink + `<br><a href="${link}" target="_blank" id="${btnId}" class="pay-btn">Pay Now 🚀</a>`;
                appendHTML(htmlReply, "ai-msg");

                // Start polling the backend to see if the webhook fired
                let pollInterval = setInterval(async () => {
                    try {
                        let statusRes = await fetch(`http://localhost:8000/status?url=${encodeURIComponent(link)}`);
                        let statusData = await statusRes.json();
                        
                        if (statusData.status === "PAID") {
                            // Payment was successful! Update the UI in real-time.
                            let payBtn = document.getElementById(btnId);
                            payBtn.innerText = "Payment Confirmed ✅";
                            payBtn.style.background = "#198754"; // Darker green
                            payBtn.style.pointerEvents = "none"; // Disable clicking again
                            
                            // Stop polling
                            clearInterval(pollInterval);
                            
                            // Make the AI say a final thank you
                            appendMessage("Thank you for your purchase! Your order has been confirmed.", "ai-msg");
                        }
                    } catch (e) {
                        console.error("Polling error", e);
                    }
                }, 3000); // Check every 3 seconds

       } else {
        // This block executes if your initial 'if' condition is false
        appendMessage(data.reply, "ai-msg");
    }
} 
catch (error) {
    console.error(error); // Best practice to log the exact error for debugging
    appendMessage("Error connecting to the server.", "ai-msg");
}

function appendMessage(text, className) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg " + className;
    msgDiv.innerText = text;
    
    const messagesContainer = document.getElementById("messages");
    if (messagesContainer) {
        messagesContainer.appendChild(msgDiv);
    } else {
        console.error("Target container #messages not found in the DOM.");
    }
}

        scrollToBottom();
    }

    function appendHTML(html, className) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg " + className;
        msgDiv.innerHTML = html;
        document.getElementById("messages").appendChild(msgDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        const messagesDiv = document.getElementById("messages");
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
