<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Commerce Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f0f2f5;
            --chat-bg: #ffffff;
            --ai-msg-bg: #f1f3f4;
            --ai-msg-text: #202124;
            --user-msg-bg: #007bff;
            --user-msg-text: #ffffff;
            --success: #10b981;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #chat-box { 
            width: 100%;
            max-width: 420px; 
            background: var(--chat-bg); 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            height: 85vh;
            max-height: 700px;
            overflow: hidden; 
        }

        /* Header Styling */
        #chat-header {
            background: #ffffff;
            padding: 16px 20px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .agent-info h2 {
            margin: 0;
            font-size: 16px;
            color: #333;
        }

        .agent-info p {
            margin: 0;
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .agent-info p::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
        }

        /* Messages Area */
        #messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }

        /* Custom Scrollbar */
        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .msg { 
            padding: 12px 16px; 
            border-radius: 16px; 
            max-width: 75%; 
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg { 
            background: var(--user-msg-bg); 
            color: var(--user-msg-text); 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.2);
        }

        .ai-msg { 
            background: var(--ai-msg-bg); 
            color: var(--ai-msg-text); 
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
        }

        /* Payment Button */
        .pay-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            margin-top: 12px; 
            padding: 10px 16px; 
            background: var(--success); 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: all 0.2s ease;
            width: fit-content;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2);
        }

        .pay-btn:hover {
            background: #0e9f6e;
            transform: translateY(-1px);
        }

        /* Input Area */
        #input-area { 
            display: flex; 
            padding: 16px; 
            background: #ffffff; 
            border-top: 1px solid #eaeaea;
            gap: 10px;
            align-items: center;
        }

        input { 
            flex-grow: 1; 
            padding: 12px 16px; 
            border: 1px solid #e2e8f0; 
            border-radius: 24px; 
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
            background: #f8fafc;
        }

        input:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        button { 
            width: 44px;
            height: 44px;
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.95); }

        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-left: 2px;
        }
    </style>
</head>
<body>

<div id="chat-box">
    <div id="chat-header">
        <div class="avatar">AI</div>
        <div class="agent-info">
            <h2>Commerce Agent</h2>
            <p>Online</p>
        </div>
    </div>

    <div id="messages">
        <div class="msg ai-msg">Hello! I can help you explore our gadgets, grooming tools, and desk accessories, or generate a checkout link whenever you're ready. What are you looking for today?</div>
    </div>
    
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" autocomplete="off">
        <button onclick="sendMessage()" aria-label="Send Message">
            <svg xmlns="http://www.3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>
</div>

<script>
    const currentSessionId = "user_" + Math.random().toString(36).substring(7);
    // Point this to your live Render server so it works on Vercel
    const API_URL = "https://ai-commence-agent-razorpay.onrender.com";

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const messageText = inputField.value.trim();
        if (!messageText) return;

        appendMessage(messageText, "user-msg");
        inputField.value = "";
        scrollToBottom();

        try {
            const response = await fetch(`${API_URL}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    message: messageText, 
                    session_id: currentSessionId 
                })
            });
            const data = await response.json();
            
            if (data.reply.includes("https://rzp.io/")) {
                const link = data.reply.match(/https:\/\/rzp\.io\S+/)[0];
                const textWithoutLink = data.reply.replace(link, "").trim();
                
                const btnId = "btn-" + Math.random().toString(36).substring(7);
                let htmlReply = textWithoutLink + `<br><a href="${link}" target="_blank" id="${btnId}" class="pay-btn">Pay Now 🚀</a>`;
                appendHTML(htmlReply, "ai-msg");

                let pollInterval = setInterval(async () => {
                    try {
                        let statusRes = await fetch(`${API_URL}/status?url=${encodeURIComponent(link)}`);
                        let statusData = await statusRes.json();
                        
                        if (statusData.status === "PAID") {
                            let payBtn = document.getElementById(btnId);
                            payBtn.innerText = "Payment Confirmed ✅";
                            payBtn.style.background = "#059669"; 
                            payBtn.style.pointerEvents = "none"; 
                            payBtn.style.boxShadow = "none";
                            
                            clearInterval(pollInterval);
                            appendMessage("Thank you for your purchase! Your order has been confirmed.", "ai-msg");
                        }
                    } catch (e) {
                        console.error("Polling error", e);
                    }
                }, 3000); 

            } else {
                appendMessage(data.reply, "ai-msg");
            }
        } catch (error) {
            console.error("Connection Error:", error); 
            appendMessage("Error connecting to the server.", "ai-msg");
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg " + className;
        msgDiv.innerText = text;
        
        const messagesContainer = document.getElementById("messages");
        if (messagesContainer) {
            messagesContainer.appendChild(msgDiv);
        }
        scrollToBottom();
    }

    function appendHTML(html, className) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg " + className;
        msgDiv.innerHTML = html;
        document.getElementById("messages").appendChild(msgDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        const messagesDiv = document.getElementById("messages");
        messagesDiv.scrollTo({
            top: messagesDiv.scrollHeight,
            behavior: 'smooth'
        });
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
