<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f0f2f5;
            --chat-bg: #ffffff;
            --ai-msg-bg: #f1f3f4;
            --ai-msg-text: #202124;
            --user-msg-bg: #007bff;
            --user-msg-text: #ffffff;
            --success: #10b981;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            display: grid;
            grid-template-columns: 350px 1fr;
            height: 100vh;
            overflow: hidden;
            background: #0f172a; /* Dark background behind split screen */
        }

        /* --- Left Column: Chat Pane --- */
        #chat-pane { 
            background: var(--chat-bg); 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            box-shadow: 2px 0 20px rgba(0,0,0,0.1);
            z-index: 10;
        }

        #chat-header {
            background: #ffffff;
            padding: 20px;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .agent-info h2 {
            margin: 0;
            font-size: 16px;
            color: #333;
        }

        .agent-info p {
            margin: 0;
            font-size: 12px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .agent-info p::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
        }

        #messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #fafafa;
        }

        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .msg { 
            padding: 12px 16px; 
            border-radius: 16px; 
            max-width: 85%; 
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg { 
            background: var(--user-msg-bg); 
            color: var(--user-msg-text); 
            align-self: flex-end; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.2);
        }

        .ai-msg { 
            background: var(--ai-msg-bg); 
            color: var(--ai-msg-text); 
            align-self: flex-start; 
            border-bottom-left-radius: 4px;
        }

        #input-area { 
            display: flex; 
            padding: 16px; 
            background: #ffffff; 
            border-top: 1px solid #eaeaea;
            gap: 10px;
            align-items: center;
        }

        input { 
            flex-grow: 1; 
            padding: 12px 16px; 
            border: 1px solid #e2e8f0; 
            border-radius: 24px; 
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
            background: #f8fafc;
        }

        input:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        button { 
            width: 44px;
            height: 44px;
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        button:hover { background: var(--primary-hover); }
        button:active { transform: scale(0.95); }

        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-left: 2px;
        }

        /* --- Right Column: Visual Stage --- */
        #visual-stage {
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* Generated Card Styles */
        .product-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .product-card h3 {
            margin: 0 0 12px 0;
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
        }

        .product-card p.desc {
            font-size: 16px;
            color: #64748b;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }

        .product-card .price {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 24px 0;
        }
        
        .product-card .display-price {
            font-size: 18px;
            color: #94a3b8;
            text-decoration: line-through;
            margin-right: 8px;
        }

        .card-enter { 
            opacity: 0; 
            transform: translateY(30px) scale(0.95); 
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        
        .card-enter-active { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
        }

        .pay-btn { 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            padding: 14px 32px; 
            background: var(--success); 
            color: white; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .pay-btn:hover {
            background: #0e9f6e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
    </style>
</head>
<body>

    <!-- Left Column: Chat Pane -->
    <div id="chat-pane">
        <div id="chat-header">
            <div class="avatar">AI</div>
            <div class="agent-info">
                <h2>Ezio</h2>
                <p>Online</p>
            </div>
        </div>

        <div id="messages">
            <div class="msg ai-msg">Hello! I can help you explore our gadgets, grooming tools, and desk accessories, or generate a checkout link whenever you're ready. What are you looking for today?</div>
        </div>
        
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button onclick="sendMessage()" aria-label="Send Message">
                <svg xmlns="http://www.3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Right Column: Visual Stage -->
    <div id="visual-stage">
        <!-- Generative UI renders cards here -->
    </div>

<script>
    const currentSessionId = "user_" + Math.random().toString(36).substring(7);
    const API_URL = "http://127.0.0.1:8000"; // Point this to your live server if needed (e.g., render URL)

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const messageText = inputField.value.trim();
        if (!messageText) return;

        appendMessage(messageText, "user-msg");
        inputField.value = "";
        scrollToBottom();

        try {
            const response = await fetch(`${API_URL}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    message: messageText, 
                    session_id: currentSessionId 
                })
            });
            const data = await response.json();
            handleResponse(data);
        } catch (error) {
            console.error("Connection Error:", error); 
            appendMessage("Error connecting to the server.", "ai-msg");
        }
    }

    function handleResponse(response) {
        // 1. Append message to chat pane
        if (response.message) {
            appendMessage(response.message, "ai-msg");
        }

        // 2. Evaluate action and render visual stage
        const stage = document.getElementById("visual-stage");

        if (response.action === "SHOW_PRODUCT" || response.action === "NEGOTIATE" || response.data) {
            // Clear existing content
            stage.innerHTML = "";
            
            if (response.data) {
                const card = document.createElement("div");
                card.className = "product-card card-enter";
                
                // Formulate Price String
                const priceInINR = response.data.display_price / 100;
                let priceHtml = `<div class="price">₹${priceInINR}</div>`;
                
                // If a payment link is provided (checkout successful), show the payment button inside the card
                let checkoutHtml = "";
                if (response.payment_link) {
                    const btnId = "btn-" + Math.random().toString(36).substring(7);
                    checkoutHtml = `<a href="${response.payment_link}" target="_blank" id="${btnId}" class="pay-btn">Pay Now 🚀</a>`;
                    
                    // Start polling for payment status
                    pollPaymentStatus(response.payment_link, btnId);
                }

                card.innerHTML = `
                    <h3>${response.data.name}</h3>
                    <p class="desc">${response.data.description}</p>
                    ${priceHtml}
                    ${checkoutHtml}
                `;
                
                stage.appendChild(card);
                
                // Trigger animation
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        card.classList.add("card-enter-active");
                    });
                });
            }
        }
    }

    function pollPaymentStatus(link, btnId) {
        let pollInterval = setInterval(async () => {
            try {
                let statusRes = await fetch(`${API_URL}/status?url=${encodeURIComponent(link)}`);
                let statusData = await statusRes.json();
                
                if (statusData.status === "PAID") {
                    let payBtn = document.getElementById(btnId);
                    if (payBtn) {
                        payBtn.innerText = "Payment Confirmed ✅";
                        payBtn.style.background = "#059669"; 
                        payBtn.style.pointerEvents = "none"; 
                        payBtn.style.boxShadow = "none";
                    }
                    
                    clearInterval(pollInterval);
                    appendMessage("Thank you for your purchase! Your order has been confirmed.", "ai-msg");
                }
            } catch (e) {
                console.error("Polling error", e);
            }
        }, 3000); 
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement("div");
        msgDiv.className = "msg " + className;
        msgDiv.innerText = text;
        
        const messagesContainer = document.getElementById("messages");
        if (messagesContainer) {
            messagesContainer.appendChild(msgDiv);
        }
        scrollToBottom();
    }

    function scrollToBottom() {
        const messagesDiv = document.getElementById("messages");
        messagesDiv.scrollTo({
            top: messagesDiv.scrollHeight,
            behavior: 'smooth'
        });
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
